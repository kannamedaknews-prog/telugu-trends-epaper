<!-- Telugu Trends Reporter Page: replace the old page HTML with this complete code -->
<div id="ttnApp" style="font-family:Arial,'Noto Sans Telugu',sans-serif;max-width:760px;margin:24px auto;padding:12px;color:#222">
 <section id="loginBox" style="max-width:520px;margin:20px auto;padding:26px;border-radius:18px;background:#fff;box-shadow:0 4px 20px #0002">
  <h1 style="text-align:center;color:#c00">📰 తెలుగు ట్రెండ్స్</h1><h2 style="text-align:center">రిపోర్టర్ లాగిన్</h2>
  <label><b>Reporter ID</b></label><input id="reporterId" placeholder="ఉదా: TT001" autocomplete="username" style="width:100%;box-sizing:border-box;padding:14px;margin:8px 0 18px;border:1px solid #ccc;border-radius:9px;font-size:17px">
  <label><b>Password / PIN</b></label><input id="reporterPassword" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:14px;margin:8px 0 18px;border:1px solid #ccc;border-radius:9px;font-size:17px">
  <button id="loginBtn" style="width:100%;padding:15px;background:#c00;color:white;border:0;border-radius:9px;font-size:18px;font-weight:bold">LOGIN</button><p id="loginMessage" role="status"></p>
 </section>
 <section id="dashboard" style="display:none;max-width:650px;margin:20px auto;padding:22px;border-radius:18px;background:white;box-shadow:0 4px 20px #0002">
  <h2 style="text-align:center;color:#c00">📰 Reporter Dashboard</h2><p id="welcome" style="text-align:center;font-weight:bold;font-size:18px"></p>
  <div style="display:grid;gap:12px"><button id="newBtn" style="padding:14px;background:#c00;color:white;border:0;border-radius:9px;font-size:18px">📝 కొత్త వార్త</button><button id="mineBtn" style="padding:14px;background:#333;color:white;border:0;border-radius:9px;font-size:18px">📰 నా వార్తలు</button><button id="logoutBtn" style="padding:14px;background:#777;color:white;border:0;border-radius:9px;font-size:18px">🚪 Logout</button></div><div id="panel" style="margin-top:22px"></div>
 </section>
</div>
<script>
(function(){
'use strict';
var cfg={apiKey:'AIzaSyAlKstSb3srQXW2UjoDcE-4nF_9eogE9qw',authDomain:'telugu-trends-news.firebaseapp.com',projectId:'telugu-trends-news',storageBucket:'telugu-trends-news.firebasestorage.app',messagingSenderId:'92780017343',appId:'1:92780017343:web:82f0590564ec8104bb380a'};
// Add reporter IDs and their Firebase Auth email addresses here.
var emails={'TT001':'vikasinews+tt001@gmail.com'}; var auth,db,activeId='';
function E(id){return document.getElementById(id)} function msg(id,t,c){E(id).textContent=t;E(id).style.color=c||'#333'}
function script(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function init(){var p=Promise.resolve();if(!window.firebase)p=p.then(function(){return script('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js')});p=p.then(function(){return window.firebase.auth?null:script('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js')}).then(function(){return window.firebase.firestore?null:script('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js')}).then(function(){if(!firebase.apps.length)firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore()});return p}
function dashboard(){E('loginBox').style.display='none';E('dashboard').style.display='block';E('welcome').textContent='స్వాగతం '+activeId;E('panel').innerHTML=''}
E('loginBtn').onclick=function(){var id=E('reporterId').value.trim().toUpperCase(),pw=E('reporterPassword').value;if(!id||!pw){msg('loginMessage','Reporter ID, Password నమోదు చేయండి.','red');return}if(!emails[id]){msg('loginMessage','ఈ Reporter ID నమోదు కాలేదు.','red');return}msg('loginMessage','లాగిన్ అవుతోంది...');init().then(function(){return auth.signInWithEmailAndPassword(emails[id],pw)}).then(function(){activeId=id;dashboard()}).catch(function(e){console.error(e);msg('loginMessage','లాగిన్ కాలేదు. ID/Password తనిఖీ చేయండి. ('+(e.code||'error')+')','red')})};
E('newBtn').onclick=function(){E('panel').innerHTML='<div style="padding:18px;border:1px solid #ddd;border-radius:12px"><h3 style="text-align:center;color:#c00">📝 కొత్త వార్త పంపండి</h3><label><b>వార్త శీర్షిక *</b></label><input id="nTitle" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px"><label><b>జిల్లా *</b></label><input id="nDistrict" placeholder="ఉదా: మెదక్" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px"><label><b>మండలం *</b></label><input id="nMandal" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px"><label><b>గ్రామం / పట్టణం</b></label><input id="nVillage" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px"><label><b>వార్త వివరాలు *</b></label><textarea id="nContent" rows="8" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px"></textarea><label><b>ఫోటో URL (ఉంటే)</b></label><input id="nPhoto" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px"><label><b>వీడియో URL (ఉంటే)</b></label><input id="nVideo" style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px"><button id="sendNews" style="width:100%;padding:14px;background:#c00;color:white;border:0;border-radius:8px;font-size:17px">📨 వార్త పంపండి</button><p id="sendMsg"></p></div>';
E('sendNews').onclick=function(){var title=E('nTitle').value.trim(),district=E('nDistrict').value.trim(),mandal=E('nMandal').value.trim(),content=E('nContent').value.trim(),m=E('sendMsg'),u=auth&&auth.currentUser;if(!title||!district||!mandal||!content){m.textContent='శీర్షిక, జిల్లా, మండలం, వార్త వివరాలు తప్పనిసరి.';m.style.color='red';return}if(!u){m.textContent='మళ్లీ లాగిన్ చేయండి.';m.style.color='red';return}m.textContent='వార్త సేవ్ అవుతోంది...';db.collection('News').add({reporterUid:u.uid,reporterId:activeId,title:title,district:district,mandal:mandal,village:E('nVillage').value.trim(),content:content,photoUrl:E('nPhoto').value.trim(),videoUrl:E('nVideo').value.trim(),status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){m.textContent='వార్త సమర్పించబడింది. అడ్మిన్ అప్రూవల్ కోసం వేచి ఉంది.';m.style.color='green';['nTitle','nDistrict','nMandal','nVillage','nContent','nPhoto','nVideo'].forEach(function(x){E(x).value=''})}).catch(function(e){console.error(e);m.textContent='వార్త సేవ్ కాలేదు. Firestore Rules లేదా News collection తనిఖీ చేయాలి. ('+(e.code||'error')+')';m.style.color='red'})}}
};
E('mineBtn').onclick=function(){E('panel').innerHTML='<div style="padding:16px;border:1px solid #ddd;border-radius:10px"><h3 style="color:#c00">📰 నా వార్తలు</h3><p id="mineStatus">లోడ్ అవుతోంది...</p><div id="mineList"></div></div>';var u=auth&&auth.currentUser;if(!u){msg('mineStatus','మళ్లీ లాగిన్ చేయండి.','red');return}db.collection('News').where('reporterUid','==',u.uid).get().then(function(s){var list=E('mineList');list.innerHTML='';if(s.empty){msg('mineStatus','ఇంకా వార్తలు పంపలేదు.');return}msg('mineStatus','మీరు పంపిన వార్తలు: '+s.size);s.forEach(function(doc){var d=doc.data(),a=document.createElement('article');a.style.cssText='padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px';var h=document.createElement('b');h.textContent=d.title||'శీర్షిక లేదు';var p=document.createElement('p');p.textContent='స్థితి: '+(d.status||'pending');a.appendChild(h);a.appendChild(p);list.appendChild(a)})}).catch(function(e){console.error(e);msg('mineStatus','వార్తలు లోడ్ కాలేదు. Firestore Rules తనిఖీ చేయాలి. ('+(e.code||'error')+')','red')})};
E('logoutBtn').onclick=function(){if(!auth){E('dashboard').style.display='none';E('loginBox').style.display='block';return}auth.signOut().finally(function(){activeId='';E('reporterPassword').value='';E('dashboard').style.display='none';E('loginBox').style.display='block';E('panel').innerHTML='';msg('loginMessage','Logout అయ్యారు.','green')})};
})();
</script>
