<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>తెలుగు ట్రెండ్స్ — E-Paper</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:Arial,'Noto Sans Telugu',sans-serif;color:#111}.wrap{max-width:1100px;margin:12px auto;background:#fff}.head{border-bottom:4px solid #123b7a;padding:12px 18px 9px;text-align:center;background:linear-gradient(180deg,#eef6ff,#fff)}.brand{font-size:42px;font-weight:900;line-height:1.1;letter-spacing:.3px}.brand-blue{color:#123b7a}.brand-red{color:#c62828}.meta{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;border-top:1px solid #999;padding-top:6px}.breaking{background:#111;color:#fff;padding:7px 10px;white-space:nowrap;overflow:hidden}.breaking b{background:#d00;padding:4px 8px;margin-right:10px}.lead{display:grid;grid-template-columns:2fr 1fr;gap:14px;padding:14px;border-bottom:1px solid #999}.lead h1{font-size:30px;line-height:1.25;margin:5px 0 10px}.lead img{width:100%;max-height:330px;object-fit:cover}.side{border-left:1px solid #aaa;padding-left:14px}.side article{border-bottom:1px solid #aaa;padding-bottom:10px;margin-bottom:10px}.side h2{font-size:20px;margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 14px 14px}.card{padding:12px;border-right:1px solid #aaa;border-bottom:1px solid #aaa}.category{font-size:11px;font-weight:800;color:#b21f2d;margin:4px 0;text-transform:uppercase}.article-body{font-size:13px;line-height:1.6}.article-body p{margin:6px 0}.article-body h1,.article-body h2,.article-body h3{line-height:1.3}.article-body img{max-width:100%;height:auto!important;display:block;margin:7px auto}.article-body a{color:inherit}.card:nth-child(3n){border-right:0}.card h3{font-size:18px;line-height:1.35;margin:5px 0}.card img{width:100%;height:125px;object-fit:cover}.empty{padding:30px;text-align:center}.tools{position:sticky;top:0;background:#fff;border-bottom:1px solid #aaa;padding:8px;text-align:center;z-index:5}.tools button{padding:7px 12px;margin:2px;border:1px solid #555;background:#fff;border-radius:4px}.footer{text-align:center;border-top:3px solid #111;padding:10px;font-size:12px}
@media(max-width:700px){.brand{font-size:30px}.meta{font-size:11px}.lead{grid-template-columns:1fr}.side{border-left:0;padding-left:0}.grid{grid-template-columns:1fr 1fr}.card:nth-child(3n){border-right:1px solid #aaa}.card:nth-child(2n){border-right:0}.lead h1{font-size:24px}.card h3{font-size:16px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.card,.card:nth-child(2n),.card:nth-child(3n){border-right:0}.meta{display:block}.meta span{display:block;margin:2px 0}}
@media print{
 body *{visibility:hidden!important}
 .wrap,.wrap *{visibility:visible!important}
 body{background:#fff!important}
 .wrap{position:absolute;left:0;top:0;width:100%;margin:0;max-width:none;box-shadow:none}
 .tools{display:none!important}
 .breaking{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .card,.full-story{break-inside:avoid}
 .card img,.full-story img{break-inside:avoid}
 @page{size:A4;margin:8mm}
}
.post-title,.entry-title,.page-title{display:none!important}
</style>
</head>
<body>
<div class="tools"><button onclick="window.print()">🖨️ Print / PDF</button><button onclick="location.reload()">🔄 Refresh News</button></div>
<div class="wrap">
<header class="head">
<div class="brand"><span class="brand-blue">తెలుగు</span> <span class="brand-red">ట్రెండ్స్</span></div>
<div class="meta"><span id="today"></span><span>www.telugutrendsnews.com</span><span>Daily E-Paper</span></div>
</header>
<div class="breaking"><b>BREAKING</b><span id="ticker">తాజా వార్తలు లోడ్ అవుతున్నాయి...</span></div>
<section class="lead" id="leadArea"><div class="empty">వార్తలు లోడ్ అవుతున్నాయి...</div></section>
<section class="grid" id="newsGrid"></section>
<footer class="footer">తెలుగు ట్రెండ్స్ • www.telugutrendsnews.com</footer>
</div>
<script>
(function(){
var BLOG='https://www.telugutrendsnews.com';
var limit=12;
var today=new Date();
document.getElementById('today').innerHTML=today.toLocaleDateString('te-IN',{day:'2-digit',month:'long',year:'numeric'});
window.teluguTrendsFeed=function(data){
 try{
  var entries=(data.feed&&data.feed.entry)?data.feed.entry:[];
  if(!entries.length){showError('ఇంకా వార్తలు అందుబాటులో లేవు.');return;}
  var lead=entries[0];
  var rest=entries.slice(1);
  document.getElementById('leadArea').innerHTML=renderLead(lead);
  document.getElementById('newsGrid').innerHTML=rest.map(renderCard).join('');
  document.getElementById('ticker').innerHTML=entries.slice(0,5).map(function(e){return esc(getTitle(e));}).join('  •  ');
 }catch(e){showError('వార్తలను ప్రదర్శించడంలో సమస్య వచ్చింది.');}
};
function load(){
 var old=document.getElementById('ttFeedScript'); if(old){old.remove();}
 var s=document.createElement('script');
 s.id='ttFeedScript';
 s.src=BLOG+'/feeds/posts/default?alt=json-in-script&callback=teluguTrendsFeed&max-results='+limit;
 s.onerror=function(){showError('Blogger వార్తల Feed తెరవలేకపోయింది.');};
 document.body.appendChild(s);
}
function getTitle(e){return e.title&&e.title.$t?e.title.$t:'శీర్షిక లేదు';}
function getContent(e){return e.content&&e.content.$t?e.content.$t:'';}
function getImage(e){var x=getContent(e);var m=x.match(/<img[^>]+src=["']([^"']+)["']/i);return m?m[1]:'';}
function getLink(e){if(!e.link)return '#';for(var i=0;i<e.link.length;i++){if(e.link[i].rel==='alternate')return e.link[i].href;}return '#';}
function cleanArticleHtml(html){
 var d=document.createElement('div');
 d.innerHTML=html||'';
 d.querySelectorAll('script,style,iframe,form').forEach(function(x){x.remove();});
 d.querySelectorAll('img').forEach(function(img){img.style.maxWidth='100%';img.style.height='auto';});
 return d.innerHTML;
}
function renderLead(e){
 var img=getImage(e);
 var body=cleanArticleHtml(getContent(e));
 return '<div>'+ (img?'<img src="'+escAttr(img)+'" alt="">':'') +'</div><div class="full-story"><div class="category">'+esc(getLabel(e))+'</div><h1>'+esc(getTitle(e))+'</h1><div class="article-body">'+body+'</div></div>';
}
function renderCard(e){
 var img=getImage(e);
 var body=cleanArticleHtml(getContent(e));
 return '<article class="card full-story">'+(img?'<img src="'+escAttr(img)+'" alt="">':'')+'<div class="category">'+esc(getLabel(e))+'</div><h3>'+esc(getTitle(e))+'</h3><div class="article-body">'+body+'</div></article>';
}
function getLabel(e){return e.category&&e.category.length&&e.category[0].term?e.category[0].term:'వార్తలు';}
function strip(s){var d=document.createElement('div');d.innerHTML=s;return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return esc(s).replace(/'/g,'&#39;');}
function showError(msg){document.getElementById('leadArea').innerHTML='<div class="empty"><b>'+msg+'</b><br><br>Refresh నొక్కి మళ్లీ ప్రయత్నించండి.</div>';}
load();
})();
</script>
</body>
</html>
