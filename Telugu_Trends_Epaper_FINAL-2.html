<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>తెలుగు ట్రెండ్స్ — E-Paper</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:#151515;font-family:Arial,"Noto Sans Telugu",sans-serif}
#epaper{max-width:1100px;margin:14px auto;background:#fff}
.masthead{background:linear-gradient(90deg,#073b9e,#fff,#e21d25);border-bottom:5px solid #e21d25;padding:12px 18px 10px;text-align:center}
.brand{font-size:54px;font-weight:900;line-height:1;color:#fff;text-shadow:2px 2px 0 #111,-1px -1px 0 #111}.brand .red{color:#ffd21c}
.tagline{margin-top:6px;font-size:15px;font-weight:700;color:#111;background:#fff;display:inline-block;padding:4px 14px;border-radius:3px}
.info{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid #999;font-size:14px;font-weight:700}
.breaking{display:flex;background:#111;color:#fff}.breaking b{background:#e11;padding:9px 14px;white-space:nowrap}.breaking span{padding:9px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tools{text-align:center;padding:12px;background:#f4f4f4}button{border:2px solid #555;background:#fff;border-radius:6px;padding:9px 16px;margin:0 4px;font-size:16px;font-weight:700}
#status{text-align:center;color:#777;padding:8px}.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
.story{border:1px solid #aaa;padding:9px;background:#fff;break-inside:avoid}.story.lead{grid-column:1/-1;display:grid;grid-template-columns:48% 52%;gap:14px;border:2px solid #174ea6}
.story img{width:100%;height:210px;object-fit:cover;display:block;margin-bottom:8px}.story.lead img{height:330px;margin:0}
.story h2{font-size:23px;line-height:1.3;margin:3px 0 9px}.story:not(.lead) h2{font-size:18px}
.story p,.story .body{font-size:16px;line-height:1.75;text-align:justify}.story .body img{height:auto;max-height:none;object-fit:contain;margin:10px auto}
.meta{font-size:12px;color:#666;margin-bottom:6px}.empty{text-align:center;padding:40px;font-size:18px}
@media(max-width:700px){#epaper{margin:0}.brand{font-size:39px}.info{font-size:12px}.story.lead{display:block}.story.lead img{height:auto;margin-bottom:8px}.news-grid{grid-template-columns:1fr}.story h2,.story:not(.lead) h2{font-size:20px}}
@page{size:A4;margin:10mm}
@media print{
body{background:#fff}body *{visibility:hidden!important}#epaper,#epaper *{visibility:visible!important}
#epaper{position:absolute;left:0;top:0;width:100%;max-width:none;margin:0;background:#fff}
.tools,#status{display:none!important}.masthead,.breaking{print-color-adjust:exact;-webkit-print-color-adjust:exact}
.news-grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.story.lead{grid-column:1/-1}.story{break-inside:avoid}
.story .body{font-size:13px;line-height:1.55}.story h2{font-size:20px}.story:not(.lead) h2{font-size:16px}
.story img{height:145px}.story.lead img{height:260px}
}
</style>
</head>
<body>
<div id="epaper">
<header class="masthead"><div class="brand">తెలుగు <span class="red">ట్రెండ్స్</span></div><div class="tagline">ప్రజల కోసం.. ప్రజలతో.. ఎప్పటికప్పుడు తాజా వార్తలు</div></header>
<div class="info"><span id="date"></span><span>తెలుగు ట్రెండ్స్ — డైలీ E-Paper</span><span>www.telugutrendsnews.com</span></div>
<div class="breaking"><b>BREAKING NEWS</b><span id="breakingText">తాజా వార్తలు లోడ్ అవుతున్నాయి...</span></div>
<div class="tools"><button onclick="window.print()">🖨️ Print / PDF</button><button onclick="loadNews()">🔄 Refresh News</button></div>
<div id="status">వార్తలు లోడ్ అవుతున్నాయి...</div><main id="news" class="news-grid"></main>
</div>
<script>
const FEED="https://www.telugutrendsnews.com/feeds/posts/default?alt=json-in-script&callback=teluguTrendsFeed&max-results=12";
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function cleanHtml(raw){const d=document.createElement("div");d.innerHTML=raw||"";d.querySelectorAll("script,style,iframe,ins").forEach(x=>x.remove());return d;}
function getImage(d){const img=d.querySelector("img");return img?img.src:"";}
function articleBody(d){const first=d.querySelector("img");if(first)first.remove();return d.innerHTML;}
function formatDate(){document.getElementById("date").textContent=new Date().toLocaleDateString("te-IN",{day:"numeric",month:"long",year:"numeric"});}
function loadNews(){
document.getElementById("status").textContent="వార్తలు లోడ్ అవుతున్నాయి...";document.getElementById("news").innerHTML="";
window.teluguTrendsFeed=null;const old=document.getElementById("feedScript");if(old)old.remove();
const s=document.createElement("script");s.id="feedScript";s.src=FEED+"&_="+Date.now();
s.onerror=()=>document.getElementById("status").textContent="వార్తలు లోడ్ కాలేదు. Refresh News నొక్కండి.";document.body.appendChild(s);}
function teluguTrendsFeed(data){
const entries=(data.feed&&data.feed.entry)||[];const box=document.getElementById("news");box.innerHTML="";
if(!entries.length){document.getElementById("status").textContent="వార్తలు అందుబాటులో లేవు.";return;}
document.getElementById("status").textContent="";document.getElementById("breakingText").textContent=entries[0].title?.$t||"తాజా వార్తలు";
entries.forEach((e,i)=>{const title=e.title?.$t||"శీర్షిక లేదు";const raw=e.content?.$t||e.summary?.$t||"";const d=cleanHtml(raw);const img=getImage(d);const body=articleBody(d);
const card=document.createElement("article");card.className="story"+(i===0?" lead":"");
card.innerHTML=(img?'<div><img src="'+esc(img)+'" alt=""></div>':"")+'<div><div class="meta">తెలుగు ట్రెండ్స్</div><h2>'+esc(title)+'</h2><div class="body">'+body+'</div></div>';
box.appendChild(card);});}
formatDate();loadNews();
</script>
</body>
</html>
